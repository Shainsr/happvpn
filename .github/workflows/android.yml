name: Build SHIN APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: false

      - name: Customize App Name to SHIN & Generate White 'S' Icon
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil

          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SHIN</string>
              <string name="qs_tile_label">SHIN</string>
              <string name="widget_description">SHIN Quick Connect Widget</string>
              <string name="widget_name">SHIN Widget</string>
          </resources>
          EOF

          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw, ImageFont

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              out_dir = f"android/app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)
              img = Image.new("RGBA", (size, size), (255, 255, 255, 255))
              draw = ImageDraw.Draw(img)

              font_size = int(size * 0.68)
              font = None
              for fpath in [
                  "assets/fonts/Vazirmatn-Black.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              ]:
                  if os.path.exists(fpath):
                      font = ImageFont.truetype(fpath, font_size)
                      break
              if font is None:
                  font = ImageFont.load_default()

              bbox = draw.textbbox((0, 0), "S", font=font)
              w = bbox[2] - bbox[0]
              h = bbox[3] - bbox[1]
              x = (size - w) / 2 - bbox[0]
              y = (size - h) / 2 - bbox[1]
              draw.text((x, y), "S", fill=(11, 15, 25, 255), font=font)
              img.save(f"{out_dir}/ic_launcher.png")
          PYEOF

      - name: Fix Gradle Wrapper & AGP Compatibility
        run: |
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip
          EOF

          cat << 'EOF' > android/settings.gradle.kts
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          include(":app")
          EOF

      - name: Clean, Install & Patch Plugin Notification (Add Disconnect Button & Fix Crash)
        run: |
          flutter pub cache clean --force
          flutter pub get

          python3 - << 'PYEOF'
          import os, glob

          cache_dir = os.path.expanduser("~/.pub-cache/hosted/pub.dev")
          plugin_dirs = glob.glob(os.path.join(cache_dir, "flutter_v2ray_client*"))

          for pdir in plugin_dirs:
              for root, _, files in os.walk(pdir):
                  for fname in files:
                      if not (fname.endswith(".kt") or fname.endswith(".java")):
                          continue
                      fpath = os.path.join(root, fname)
                      with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      orig = content
                      # اصلاح پرچم‌های PendingIntent برای امنیت و عدم کرش در اندروید ۱۲ تا ۱۵
                      content = content.replace("PendingIntent.FLAG_UPDATE_CURRENT", "PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE")
                      content = content.replace("PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_IMMUTABLE", "PendingIntent.FLAG_IMMUTABLE")

                      # افزودن دکمه قطع اتصال به نوتیفیکیشن سرویس V2Ray
                      if "NotificationCompat.Builder" in content and "builder.build()" in content and "STOP_VPN_ACTION" not in content:
                          action_code = """
                          val _stopIntent = Intent(this, this.javaClass).apply { action = "STOP_VPN_ACTION" }
                          val _pStop = PendingIntent.getService(this, 9921, _stopIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                          builder.addAction(android.R.drawable.ic_menu_close_clear_cancel, "قطع اتصال", _pStop)
                          """
                          content = content.replace("builder.build()", action_code + "\nbuilder.build()")

                      if "onStartCommand" in content and "STOP_VPN_ACTION" not in content:
                          stop_handler = """
                          if (intent?.action == "STOP_VPN_ACTION") {
                              try { stopV2ray() } catch(_: Exception) { try { stopSelf() } catch(_: Exception) {} }
                              return START_NOT_STICKY
                          }
                          """
                          if "super.onStartCommand" in content:
                              content = content.replace("super.onStartCommand(intent, flags, startId)", "super.onStartCommand(intent, flags, startId)\n" + stop_handler)

                      if content != orig:
                          with open(fpath, "w", encoding="utf-8") as f:
                              f.write(content)
          PYEOF

      - name: Prepare release signing (fixed keystore from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add the release keystore to GitHub Secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release-key.jks"
          } > android/key.properties

      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')"
          fi
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "Version $VER, build code $((100 + GITHUB_RUN_NUMBER))"

      - name: Build Split-per-ABI Release APKs
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.code }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}

      - name: Build Universal Release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.code }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}

      - name: Verify APK signatures
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Using $APKSIGNER"
          for f in build/app/outputs/flutter-apk/*.apk; do
            echo "== $f"
            "$APKSIGNER" verify --verbose --print-certs "$f"
          done

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHIN-Signed-Release-APKs
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          draft: true
