name: happ_vpn
description: "SHIN VPN & Proxy Utility Client"
publish_to: 'none'
version: 1.00.3+46

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_v2ray_client: ^3.5.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
